@PART[*]:HAS[~name[kerbalEVA*]]:FINAL
{
   @MODULE[ModuleAblator]
   {
      %charMin = 0.0
      %charMax = 1.0
   }
@MODULE[ModuleColorChanger]:HAS[#moduleID[shieldChar]]
{
      @shaderProperty = _Color 
      @redCurve
      {
         // 赤
         @key,0 = 0.9975 0.28
      }
      @greenCurve
      {
         // 緑
         @key,0 = 0.9975 0.24
      }
      @blueCurve
      {
         // 青
         @key,0 = 0.9975 0.15
      }
   }
}