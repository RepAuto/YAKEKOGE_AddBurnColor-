@PART[*]:FIRST
{
	&RESOURCE[Ablator]
	{
		&amount = 0.01
		&maxAmount = 0.01
                &isTweakable = false
                &hideFlow = true
	}

	// 2. モジュール設定
	// すでにModuleAblatorがある場合は、焦げ機能だけを追加
	@MODULE[ModuleAblator]
	{
		%useChar = True
		%charModuleName = shieldChar
		%charMin = 0.0
		%charMax = 1.0

		&ablativeResource = Ablator
		&lossExp = -7500
		&lossConst = 0.1
		&pyrolysisLossFactor = 6000
		&reentryConductivity = 0.01
		&ablationTempThresh = 500
	}
	
	// ModuleAblatorが全くないパーツには丸ごと新規作成
	%MODULE[ModuleAblator]
	{
		%name = ModuleAblator
		%ablativeResource = Ablator
		%lossExp = -7500
		%lossConst = 0.1
		%pyrolysisLossFactor = 6000
		%reentryConductivity = 0.01
		%ablationTempThresh = 500
		%useChar = True
		%charModuleName = shieldChar
		%charMin = 0.0
		%charMax = 1.0
	}
	// 3. 焦げ色を制御するモジュールを追加
	MODULE
	{
		name = ModuleColorChanger
		moduleID = shieldChar
		shaderProperty = _BurnColor
		useRate = False
		toggleInEditor = False
		toggleInFlight = False
		
		redCurve
		{
			key = 0 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 0.8
		}
	}
}